# Outbound HTTP clients: a tainted URL start is SSRF.
name: http-clients
modules:
  axios: http-client
  got: http-client
  node-fetch: http-client
  undici: http-client
  request: http-client
  superagent: http-client
  needle: http-client
  cross-fetch: http-client
  isomorphic-fetch: http-client
  ky: http-client
  phin: http-client
sinks:
  - {module: http-client, exports: ["", get, post, put, patch, delete, head, request], class: ssrf, severity: high, args: ["url:0"], ignore_kinds: [dom, props, ext-message, ext-internal, postmessage], result: url}
  - {module: http-client, exports: [stream], class: ssrf, severity: high, args: ["url:0"], ignore_kinds: [dom, props, ext-message, ext-internal, postmessage]}
  - {global: [fetch], class: ssrf, severity: high, args: ["url:0"], ignore_kinds: [dom, props, ext-message, ext-internal, postmessage], result: url}
url_option_keys: [url, uri, host, hostname, baseURL]
# `const api = axios.create({ ... }); api.get(url)`: the same client (an absolute URL overrides
# any baseURL).
instances:
  http-client: {factories: [create, extend, defaults]}
propagation:
  # A response's body readers return what the response holds (`await (await fetch(url)).json()`).
  pass_methods: [json, text, arrayBuffer, blob, formData]
