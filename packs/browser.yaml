# Browser and extension sources, DOM HTML sinks.
name: browser
client_sources:
  - {methods: [addEventListener], event: message, params: first, kind: postmessage}
  - {methods: [addListener], via: [onMessage, onMessageExternal, onConnectExternal], params: first, kind: ext-message}
html_props: [innerHTML, outerHTML]
# A page's own data (its URL, messages to it): findings no route reaches are the page's.
page_kinds: [dom, postmessage, ext-message]
# Objects of these classes are never DOM nodes or jQuery sets: `params.append(k, v)` is no sink.
plain_constructors: [URLSearchParams, FormData, Headers, URL, Map, Set, WeakMap, Array, Blob, File]
# A service worker: its `request`s are the page's own (browser-side data).
service_worker:
  registrations: [self.addEventListener, addEventListener]
  events: [fetch, install, activate]
  calls: [self.skipWaiting, self.clients.claim]
  kind: dom
# Calls that create a DOM node: appending it inserts that node, not markup. On any document
# (`host.ownerDocument.createElement('video')`) or node (`template.content.cloneNode(true)`).
node_factories: [.createElement, .createElementNS, .createTextNode, .createDocumentFragment, .importNode,
  .cloneNode]
sinks:
  - {methods: [insertAdjacentHTML], class: xss, severity: high, args: ["any:1"]}
  - {methods: [html, append, prepend, after, before, replaceWith, writeln], class: xss, severity: high, args: ["html:0"]}
propagation:
  # `new URLSearchParams(location.search)` keeps what it parses; `params.get('next')` (also on
  # Headers, FormData and Map) reads a value of its receiver, never of its argument.
  pass_globals: [URLSearchParams]
  receiver_reads: [get, getAll]
sanitizers:
  # `${new URLSearchParams(q)}` is percent-encoded text.
  encoding_constructors: [URLSearchParams]
