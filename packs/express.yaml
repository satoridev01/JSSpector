# Express, and the request shape Fastify, Hapi and Node's IncomingMessage share.
name: express
request:
  server_factories: [createServer]
  names: [req, request]
  props: [body, query, params, headers, cookies, signedCookies, payload, files, file, url, originalUrl, path]
  methods: [get, param, header, json, text, formData, query, parseBody]
  upload_server_fields: [path, filename, destination, size]
  upload_objects: [file, files]
  sub_objects: [request, req]
  object_props: [body, query, payload]
  # Express 5 parses the query string with the simple parser: strings and arrays, no objects.
  scalar_props_from: [{package: express, major: 5, props: [query]}]
routes:
  methods: [get, post, put, patch, delete, del, all, use, options, head, route]
  mount_methods: [use]
  # `app.route('/book').get(list).post(create)`
  chain_methods: [route]
  # `router.route('POST', '/users', handler)` (parse-server's PromiseRouter and the like)
  verb_first_methods: [route]
  verbs: [get, post, put, patch, delete, del, head, options, all]
  factories: [express, Router, express.Router, createServer, polka, connect]
  names: [app, router, server, api, routes, route, apirouter, application, express]
  # `api.get('/users', params).then(...)`, `await api.put(url, data)`: a client's request (a
  # registration returns its router, not a promise).
  promise_methods: [then, catch, finally]
  # `api.get(url, params, (err, result) => ...)`: an error-first callback answers a request sent.
  callback_error_params: [err, error]
sinks:
  # A `root` option confines these (engine rule).
  # Never a browser's `chrome.downloads.download()`: browser-side sources do not reach Express.
  - {methods: [sendFile, download], class: path-traversal, severity: high, args: ["any:0"], confined_by: [root],
     ignore_kinds: [dom, props, ext-message, postmessage]}
