# Browser DOM: URL and window sources, script/HTML/navigation sinks.
name: dom
# (`location.pathname` is not one: browsers percent-encode the `<`, `>` and quotes an injection needs.)
member_sources:
  - {object: location, property: hash, kind: dom}
  - {object: location, property: search, kind: dom}
  - {object: location, property: href, kind: dom, fixed_start: true}
  - {object: window.location, property: hash, kind: dom}
  - {object: window.location, property: search, kind: dom}
  - {object: window.location, property: href, kind: dom, fixed_start: true}
  - {object: document, property: URL, kind: dom, fixed_start: true}
  - {object: document, property: documentURI, kind: dom, fixed_start: true}
  - {object: document, property: referrer, kind: dom}
  - {object: window, property: name, kind: dom}
sinks:
  - {methods: [document.write, document.writeln, window.document.write], class: xss, severity: high, args: ["any:0"]}
  - {global: [setTimeout, setInterval], class: code-injection, severity: high, args: ["built:0"]}
  # Navigating to an attacker URL runs `javascript:` in the page.
  - {assign: [location, location.href, window.location, window.location.href, document.location, document.location.href], class: xss, severity: medium, args: ["url:0"]}
  - {methods: [location.assign, location.replace, window.location.assign, window.location.replace, window.open], class: xss, severity: medium, args: ["url:0"]}
# Attributes (and DOM properties) whose URL the browser navigates to or loads as a document: an
# attacker who chooses the start of the URL chooses `javascript:`. `img`, `video` and `audio`
# sources never run it. JSX: intrinsic elements only (`<a href>`, never `<Link href>`).
url_attributes:
  class: xss
  severity: medium
  tags: {a: [href], area: [href], base: [href], iframe: [src], frame: [src], embed: [src],
    object: [data], form: [action], button: [formAction], input: [formAction]}
  setters: [setAttribute]
sanitizers:
  # A URL whose scheme was checked (`@braintree/sanitize-url`): not an HTML escaper.
  url_checks: [sanitizeUrl, sanitizeURL, sanitizeHref]
