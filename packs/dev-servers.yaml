# Development servers: middleware registered on Vite / webpack-dev-server / Rsbuild / connect
# instances. Their handlers see real requests from any page the developer opens (and, bound to
# every interface, from the network): rated like any server's.
name: dev-servers
routes:
  middleware_registrations:
    # `server.middlewares.use((req, res, next) => ...)` in a Vite plugin's configureServer.
    - {via: [middlewares], methods: [use], kind: dev-server}
    # Rsbuild / Modern.js `dev.setupMiddlewares: [(middlewares) => middlewares.unshift(fn)]`.
    - {objects: [middlewares], methods: [unshift, push], kind: dev-server}
