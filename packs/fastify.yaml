# Fastify: `fastify.route({ method, url, handler })` and `(request, reply)` handlers.
name: fastify
routes:
  factories: [fastify, Fastify]
  names: [fastify, instance]
  object_methods: [route]
  handler_keys: [handler, preHandler]
  method_keys: [method]
  path_keys: [url, path]
  # `fastify.register(users, { prefix: '/users' })`: users(instance) registers on `instance`.
  mount_methods: [register]
  prefix_keys: [prefix]
